<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: black;
}

video, img#preview {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  background: black;
}

img#preview { display: none; z-index: 2; }

.controls {
  position: absolute;
  bottom: 40px; left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  z-index: 10;
}

.shutter {
  width: 80px; height: 80px;
  border: 4px solid white;
  border-radius: 50%;
  background: rgba(255,255,255,0.8);
}

#shareBtn {
  position: absolute;
  bottom: 40px;
  left: 40px;
  background: rgba(0,0,0,0.5);
  color: white;
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  z-index: 20;
}
</style>
</head>
<body>

<video id="camera" autoplay playsinline></video>
<img id="preview" alt="撮影画像">

<div class="controls">
  <button id="captureBtn" class="shutter"></button>
</div>

<button id="shareBtn">共有</button>

<script>
const video = document.getElementById('camera');
const preview = document.getElementById('preview');
const captureBtn = document.getElementById('captureBtn');
const shareBtn = document.getElementById('shareBtn');

let stream = null;
let track = null;
let lastPhotoBlob = null;

// --- カメラ起動 ---
async function initCamera() {
  if (stream) stream.getTracks().forEach(t=>t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    track = stream.getVideoTracks()[0];
  } catch(err) {
    alert('カメラを利用できません: ' + err.message);
  }
}

initCamera();

// --- 撮影 ---
captureBtn.addEventListener('click', () => {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  canvas.toBlob(blob => {
    lastPhotoBlob = blob;
    preview.src = URL.createObjectURL(blob);
    preview.style.display = 'block';
    video.style.display = 'none';

    // 0.5秒後にカメラに戻る
    setTimeout(() => {
      preview.style.display = 'none';
      video.style.display = 'block';
    }, 500);
  }, 'image/jpeg');
});

// --- 共有 ---
shareBtn.addEventListener('click', async () => {
  if (!lastPhotoBlob) {
    alert('まず撮影してください');
    return;
  }

  const file = new File([lastPhotoBlob], 'photo.jpg', { type: 'image/jpeg' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        title: '撮った写真',
        files: [file]
      });
    } catch(err) {
      console.log('共有をキャンセルまたは失敗: ', err);
    }
  } else {
    // フォールバック: ダウンロード
    const a = document.createElement('a');
    a.href = URL.createObjectURL(lastPhotoBlob);
    a.download = 'photo.jpg';
    a.click();
  }
});
</script>
</body>
</html>
