<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: black;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: sans-serif;
  }

  video, img {
    width: 100%;
    height: auto;
    background: black;
    flex: 1;
    object-fit: contain;
  }

  /* ボタン共通 */
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.5);
    padding: 15px 0;
  }

  button {
    background: none;
    border: none;
    cursor: pointer;
  }

  /* --- デフォルト（Windows向け） --- */
  .shutter {
    width: 70px;
    height: 70px;
    border: 4px solid white;
    border-radius: 50%;
    background: #ddd;
    box-shadow: 0 0 8px #555;
  }

  .share {
    margin-left: 30px;
    font-size: 1.4em;
    color: white;
    background: rgba(255,255,255,0.2);
    padding: 8px 16px;
    border-radius: 8px;
  }

  /* --- iOS風 --- */
  .ios .shutter {
    width: 80px;
    height: 80px;
    border: 4px solid white;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 8px #444;
  }

  .ios .share {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255,255,255,0.3);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 1.2em;
  }

  /* --- Android風 --- */
  .android .shutter {
    width: 85px;
    height: 85px;
    border: 4px solid #fff;
    border-radius: 50%;
    background: #eee;
    box-shadow: 0 0 8px #000;
  }

  .android .share {
    position: absolute;
    bottom: 100px;
    right: 20px;
    background: rgba(255,255,255,0.25);
    padding: 12px;
    border-radius: 50%;
    font-size: 1.5em;
    color: white;
  }

  img#preview {
    display: none;
  }
</style>
</head>
<body>

<video id="camera" autoplay playsinline></video>
<img id="preview" alt="撮影画像">

<div class="controls">
  <button id="captureBtn" class="shutter"></button>
  <button id="shareBtn" class="share" style="display:none;">📤</button>
</div>

<script>
const video = document.getElementById('camera');
const preview = document.getElementById('preview');
const captureBtn = document.getElementById('captureBtn');
const shareBtn = document.getElementById('shareBtn');

// --- OS判別とクラス付与 ---
const ua = navigator.userAgent.toLowerCase();
if (/iphone|ipad|ipod/.test(ua)) {
  document.body.classList.add('ios');
} else if (/android/.test(ua)) {
  document.body.classList.add('android');
} else {
  // Windowsなどはデフォルト
}

// --- カメラ起動 ---
async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
  } catch (err) {
    alert('カメラを利用できません: ' + err.message);
  }
}

let capturedBlob = null;

// --- 撮影 ---
captureBtn.addEventListener('click', () => {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  canvas.toBlob(blob => {
    capturedBlob = blob;
    preview.src = URL.createObjectURL(blob);
    preview.style.display = 'block';
    video.style.display = 'none';
    shareBtn.style.display = 'inline-block';
  }, 'image/jpeg');
});

// --- 共有 ---
shareBtn.addEventListener('click', async () => {
  if (!capturedBlob) return;

  const file = new File([capturedBlob], 'photo.jpg', { type: 'image/jpeg' });

  if (navigator.share) {
    try {
      await navigator.share({
        files: [file],
        text: '撮影した写真を共有します'
      });
    } catch (err) {
      console.log('共有がキャンセルされました:', err);
    }
  } else {
    // 共有APIが使えない場合はダウンロード
    const a = document.createElement('a');
    a.href = URL.createObjectURL(capturedBlob);
    a.download = 'photo.jpg';
    a.click();
  }
});

initCamera();
</script>

</body>
</html>
