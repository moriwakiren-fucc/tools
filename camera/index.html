<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カメラ</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: black;
  }
  #camera-container {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: center center;
  }
  #shutter-btn, #switch-btn {
    position: absolute;
    bottom: 20px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: white;
    border: 5px solid rgba(0,0,0,0.3);
  }
  #shutter-btn { left: 50%; transform: translateX(-50%); }
  #switch-btn { right: 20px; background: lightgray; }

  #zoom-slider {
    position: absolute;
    bottom: 110px;         /* シャッターボタンのすぐ上 */
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
  }

  #gallery {
    position: absolute;
    left: 10px;
    bottom: 20px;
    width: 60px;
    height: 60px;
    border: 2px solid white;
    background: rgba(255,255,255,0.2);
    overflow: hidden;
  }
  #gallery img { width: 100%; height: 100%; object-fit: cover; }

  /* 写真表示画面 */
  #photo-viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 50px;
    overflow-y: auto;
  }
  .viewer-img {
    width: 90%;
    max-width: 500px;
    margin: 20px auto;
    display: block;
  }

  /* ボタン */
  .viewer-btn {
    position: fixed;
    right: 20px;
    background: rgba(255,255,255,0.8);
    color: black;
    border: none;
    padding: 14px 20px;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
  }
  #close-viewer-btn { top: 20px; }
  #share-all-btn   { top: 80px; }
  #download-all-btn{ top: 150px; }

  .photo-action {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
  }
  .photo-action button {
    padding: 12px 20px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.9);
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="camera-container">
  <video id="video" autoplay playsinline></video>
  <button id="shutter-btn"></button>
  <button id="switch-btn">↺</button>
  <input type="range" id="zoom-slider" min="1" max="1" step="0.01" value="1">
  <div id="gallery"></div>
</div>

<div id="photo-viewer">
  <button class="viewer-btn" id="close-viewer-btn">閉じる</button>
  <button class="viewer-btn" id="share-all-btn">全共有</button>
  <button class="viewer-btn" id="download-all-btn">全ダウンロード</button>
  <div id="photo-list"></div>
</div>

<script>
const video = document.getElementById('video');
const shutterBtn = document.getElementById('shutter-btn');
const switchBtn = document.getElementById('switch-btn');
const zoomSlider = document.getElementById('zoom-slider');
const gallery = document.getElementById('gallery');

const photoViewer = document.getElementById('photo-viewer');
const photoList = document.getElementById('photo-list');
const closeViewerBtn = document.getElementById('close-viewer-btn');
const shareAllBtn = document.getElementById('share-all-btn');
const downloadAllBtn = document.getElementById('download-all-btn');

let stream, videoTrack, imageCapture;
let currentZoom = 1;
let minZoom = 1, maxZoom = 1;
let useFrontCamera = false;
let photos = [];

// カメラ開始
async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: useFrontCamera ? "user" : "environment" },
    audio: false
  });
  video.srcObject = stream;
  videoTrack = stream.getVideoTracks()[0];

  // ズーム対応チェック
  const settings = videoTrack.getSettings();
  const capabilities = videoTrack.getCapabilities();
  if(capabilities.zoom){
    minZoom = capabilities.zoom.min || 1;
    maxZoom = capabilities.zoom.max || 1;
    currentZoom = settings.zoom || 1;
    zoomSlider.min = minZoom;
    zoomSlider.max = maxZoom;
    zoomSlider.step = 0.01;
    zoomSlider.value = currentZoom;
  }

  imageCapture = new ImageCapture(videoTrack);
}

// シャッター
shutterBtn.addEventListener('click', async ()=>{
  if(!imageCapture) return;

  // シャッター時に映像を一時停止
  video.pause();
  setTimeout(()=> video.play(), 250); // 0.25秒後に再開

  const bitmap = await imageCapture.grabFrame();
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0);

  // 撮影日時をファイル名に
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  const hh = String(now.getHours()).padStart(2,'0');
  const mi = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  const filename = `${yyyy}${mm}${dd}${hh}${mi}${ss}.jpg`;

  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    photos.unshift({url, filename}); // 上に積む
    updateGallery();
  }, 'image/jpeg');
});

// ギャラリー更新
function updateGallery(){
  if(photos.length>0){
    gallery.innerHTML = `<img src="${photos[0].url}" alt="preview">`;
    gallery.onclick = openViewer;
  }
}

// カメラ切替
switchBtn.addEventListener('click', ()=>{
  useFrontCamera = !useFrontCamera;
  startCamera();
});

// ズーム（スライダー）
zoomSlider.addEventListener('input', ()=>{
  currentZoom = parseFloat(zoomSlider.value);
  videoTrack.applyConstraints({ advanced:[{zoom: currentZoom}] });
});

// ===== ピンチズーム対応 =====
let pinchStartDist = 0;
let pinchStartZoom = 1;

video.addEventListener('touchstart', e=>{
  if(e.touches.length===2){
    e.preventDefault();
    pinchStartDist = getPinchDist(e.touches);
    pinchStartZoom = currentZoom;
  }
},{passive:false});

video.addEventListener('touchmove', e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const newDist = getPinchDist(e.touches);
    const scale = newDist / pinchStartDist;
    let newZoom = Math.min(maxZoom, Math.max(minZoom, pinchStartZoom * scale));
    currentZoom = newZoom;
    zoomSlider.value = newZoom;
    videoTrack.applyConstraints({ advanced:[{zoom: newZoom}] });
  }
},{passive:false});

function getPinchDist(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

// 写真ビューア
function openViewer(){
  photoList.innerHTML = '';
  photos.forEach(p=>{
    const div = document.createElement('div');
    const img = document.createElement('img');
    img.src = p.url;
    img.className = 'viewer-img';
    div.appendChild(img);

    const actions = document.createElement('div');
    actions.className = 'photo-action';

    const shareBtn = document.createElement('button');
    shareBtn.textContent = '共有';
    shareBtn.onclick = ()=> shareSingle(p);

    const downloadBtn = document.createElement('button');
    downloadBtn.textContent = 'ダウンロード';
    downloadBtn.onclick = ()=> downloadSingle(p);

    actions.appendChild(shareBtn);
    actions.appendChild(downloadBtn);
    div.appendChild(actions);
    photoList.appendChild(div);
  });
  photoViewer.style.display = 'flex';
}

closeViewerBtn.onclick = ()=> photoViewer.style.display = 'none';

// 全共有
shareAllBtn.onclick = async ()=>{
  if(navigator.share && photos.length>0){
    const files = await Promise.all(photos.map(p=> fetch(p.url)
      .then(res=>res.blob())
      .then(blob=> new File([blob], p.filename,{type:'image/jpeg'}))
    ));
    try{
      await navigator.share({ files });
    }catch(e){ console.log(e); }
  }else{
    alert('この端末はWeb Share APIをサポートしていません');
  }
};

// 全ダウンロード
downloadAllBtn.onclick = ()=>{
  photos.forEach(p=> downloadSingle(p));
};

function shareSingle(photo){
  if(navigator.share){
    fetch(photo.url).then(res=>res.blob()).then(blob=>{
      const file = new File([blob], photo.filename, {type:'image/jpeg'});
      navigator.share({ files:[file] }).catch(()=>{});
    });
  }else{
    downloadSingle(photo);
  }
}

function downloadSingle(photo){
  const a = document.createElement('a');
  a.href = photo.url;
  a.download = photo.filename;
  a.click();
}

// 初期化
startCamera();
</script>
</body>
</html>
