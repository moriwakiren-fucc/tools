<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/piexifjs"></script>
<style>
/* 元のスタイルはそのまま */
body,html{
  margin:0;
  padding:0;
  height:100%;
  background:black;
  overflow:hidden;
}
#cameraContainer{
  position:relative;
  width:100%;
  height:100%;
  background:black;
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
}
#shutterBtn{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  width:80px;
  height:80px;
  border-radius:50%;
  background:white;
  border:4px solid rgba(255,255,255,0.5);
  cursor:pointer;
}
#switchCamBtn{
  position:absolute;
  bottom:140px;
  left:50%;
  transform:translateX(-50%);
  width:50px;
  height:50px;
  border-radius:50%;
  background:rgba(255,255,255,0.7);
  border:none;
  cursor:pointer;
}
#galleryBtn{
  position:absolute;
  bottom:40px;
  left:20px;
  width:60px;
  height:60px;
  border-radius:10px;
  background:rgba(255,255,255,0.3);
  border:none;
  cursor:pointer;
  overflow:hidden;
}
#zoomContainer{
  position:absolute;
  bottom:120px;
  left:50%;
  transform:translateX(-50%);
  width:200px;
  text-align:center;
  color:white;
  font-size:1rem;
}
#zoomSlider{
  width:100%;
}
#galleryOverlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  overflow-y:auto;
  padding:20px;
  box-sizing:border-box;
}
#galleryButtons{
  position:fixed;
  top:20px;
  right:15px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:20px;
  z-index:1000;
}
.galleryControlBtn{
  width:160px;
  padding:14px 0;
  font-size:1.1rem;
  text-align:center;
  border:none;
  border-radius:8px;
  background:rgba(255,255,255,0.9);
  color:#000;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
}
#closeGalleryBtn{align-self:flex-end;}
#galleryImages{
  margin-top:140px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}
.galleryItem img{
  max-width:80vw;
  max-height:60vh;
  display:block;
  margin-bottom:10px;
}
.galleryItem button{
  display:block;
  width:120px;
  margin:10px auto;
  padding:10px 0;
  border:none;
  border-radius:6px;
  background:rgba(255,255,255,0.9);
  cursor:pointer;
}
</style>
</head>
<body>
<div id="cameraContainer">
  <video id="camera" autoplay playsinline></video>
  <button id="galleryBtn">📷</button>
  <!-- ズームスライダーと倍率表示 -->
  <div id="zoomContainer">
    <div id="zoomValue">1.0x</div>
    <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
  </div>
  <button id="switchCamBtn">⇆</button>
  <button id="shutterBtn"></button>
</div>

<div id="galleryOverlay">
  <div id="galleryButtons">
    <button id="closeGalleryBtn" class="galleryControlBtn">閉じる</button>
    <button id="shareAllBtn" class="galleryControlBtn">全共有</button>
    <button id="downloadAllBtn" class="galleryControlBtn">全ダウンロード</button>
  </div>
  <div id="galleryImages"></div>
</div>

<script>
const video=document.getElementById('camera');
const shutterBtn=document.getElementById('shutterBtn');
const switchCamBtn=document.getElementById('switchCamBtn');
const galleryBtn=document.getElementById('galleryBtn');
const zoomSlider=document.getElementById('zoomSlider');
const zoomValue=document.getElementById('zoomValue');
const galleryOverlay=document.getElementById('galleryOverlay');
const closeGalleryBtn=document.getElementById('closeGalleryBtn');
const shareAllBtn=document.getElementById('shareAllBtn');
const downloadAllBtn=document.getElementById('downloadAllBtn');
const galleryImages=document.getElementById('galleryImages');

let currentStream=null;
let useFrontCamera=false;
let photos=[];

let pinchStartDist=0;
let pinchStartZoom=1;

async function startCamera(){
  if(currentStream){
    currentStream.getTracks().forEach(t=>t.stop());
  }
  currentStream=await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:useFrontCamera?'user':'environment'},
    audio:false
  });
  video.srcObject=currentStream;
  applyZoom();
}

function applyZoom(){
  const track=currentStream?.getVideoTracks()[0];
  const cap=track?.getCapabilities?.();
  if(cap?.zoom){
    let zoom=parseFloat(zoomSlider.value);
    track.applyConstraints({advanced:[{zoom}]});
    zoomValue.textContent=zoom.toFixed(1)+'x';
  }
}

// スライダー連動
zoomSlider.addEventListener('input',applyZoom);

// ピンチズーム
video.addEventListener('touchstart', e=>{
  if(e.touches.length===2){
    pinchStartDist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    const track=currentStream?.getVideoTracks()[0];
    pinchStartZoom=track?.getSettings()?.zoom || parseFloat(zoomSlider.value);
  }
},{passive:false});

video.addEventListener('touchmove', e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const newDist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    const scale=newDist/pinchStartDist;
    const track=currentStream?.getVideoTracks()[0];
    const cap=track?.getCapabilities?.();
    if(cap?.zoom){
      let newZoom=Math.min(cap.zoom.max, Math.max(cap.zoom.min, pinchStartZoom*scale));
      track.applyConstraints({advanced:[{zoom:newZoom}]});
      zoomSlider.value=newZoom;
      zoomValue.textContent=newZoom.toFixed(1)+'x';
    }
  }
},{passive:false});

// ピンチ防止（既存コード）
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('gestureend',e=>e.preventDefault());

// カメラ切替
switchCamBtn.addEventListener('click',()=>{
  useFrontCamera=!useFrontCamera;
  startCamera();
});

// 以下、撮影・ギャラリー処理は元のコードのまま
shutterBtn.addEventListener('click',async()=>{
  const canvas=document.createElement('canvas');
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  const now=new Date();
  const pad=n=>n.toString().padStart(2,'0');
  const timestamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const filename=`${timestamp}.jpg`;

  const jpegDataURL=canvas.toDataURL('image/jpeg',0.92);
  let exifObj={"0th":{},"Exif":{},"GPS":{}};
  const dateStr=`${now.getFullYear()}:${pad(now.getMonth()+1)}:${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  exifObj["0th"][piexif.ImageIFD.DateTime]=dateStr;
  exifObj["Exif"][piexif.ExifIFD.DateTimeOriginal]=dateStr;
  exifObj["Exif"][piexif.ExifIFD.DateTimeDigitized]=dateStr;
  const exifBytes=piexif.dump(exifObj);
  const newJpeg=piexif.insert(exifBytes,jpegDataURL);

  const res=await fetch(newJpeg);
  const blob=await res.blob();
  photos.unshift({blob,filename});
  galleryBtn.style.backgroundImage=`url(${URL.createObjectURL(blob)})`;
  galleryBtn.style.backgroundSize='cover';

  const track=video.srcObject.getVideoTracks()[0];
  track.enabled=false;
  setTimeout(()=>track.enabled=true,250);
});

galleryBtn.addEventListener('click',()=>{
  galleryImages.innerHTML='';
  photos.forEach((photo,i)=>{
    const item=document.createElement('div');
    item.className='galleryItem';
    const img=document.createElement('img');
    img.src=URL.createObjectURL(photo.blob);

    const shareBtn=document.createElement('button');
    shareBtn.textContent='共有';
    shareBtn.onclick=async()=>{
      const file=new File([photo.blob],photo.filename,{type:'image/jpeg'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:'写真共有'});}
        catch(e){console.log(e);}
      }
    };

    const dlBtn=document.createElement('button');
    dlBtn.textContent='ダウンロード';
    dlBtn.onclick=()=>{
      const a=document.createElement('a');
      a.href=img.src;
      a.download=photo.filename;
      a.click();
    };

    item.appendChild(img);
    item.appendChild(shareBtn);
    item.appendChild(dlBtn);
    galleryImages.appendChild(item);
  });
  galleryOverlay.style.display='flex';
});

shareAllBtn.onclick=async()=>{
  const files=photos.map(p=>new File([p.blob],p.filename,{type:'image/jpeg'}));
  if(navigator.canShare && navigator.canShare({files})){
    try{await navigator.share({files,title:'全共有'});}
    catch(e){console.log(e);}
  }
};

downloadAllBtn.onclick=async()=>{
  const zip=new JSZip();
  photos.forEach(p=>zip.file(p.filename,p.blob));
  const content=await zip.generateAsync({type:'blob'});
  const url=URL.createObjectURL(content);
  const a=document.createElement('a');
  a.href=url;
  a.download='photos.zip';
  a.click();
  URL.revokeObjectURL(url);
};

closeGalleryBtn.onclick=()=>galleryOverlay.style.display='none';

startCamera();
</script>
</body>
</html>
