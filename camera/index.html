<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body,html{
  margin:0;
  padding:0;
  height:100%;
  background:black;
  overflow:hidden;
}
#cameraContainer{
  position:relative;
  width:100%;
  height:100%;
  background:black;
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
}
#shutterBtn{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  width:80px;
  height:80px;
  border-radius:50%;
  background:white;
  border:4px solid rgba(255,255,255,0.5);
  cursor:pointer;
}
#switchCamBtn{
  position:absolute;
  bottom:140px;
  left:50%;
  transform:translateX(-50%);
  width:50px;
  height:50px;
  border-radius:50%;
  background:rgba(255,255,255,0.7);
  border:none;
  cursor:pointer;
}
#galleryBtn{
  position:absolute;
  bottom:40px;
  left:20px;
  width:60px;
  height:60px;
  border-radius:10px;
  background:rgba(255,255,255,0.3);
  border:none;
  cursor:pointer;
  overflow:hidden;
}
#zoomSlider{
  position:absolute;
  bottom:120px;   /* シャッターボタン近く */
  left:50%;
  transform:translateX(-50%);
  width:200px;
}

/* ギャラリー */
#galleryOverlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  display:none;
  flex-direction:column;
  align-items:center;
  overflow-y:auto;
  padding:20px;
  box-sizing:border-box;
}

#galleryButtons{
  position:fixed;
  top:15px;
  right:15px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:15px;              /* ボタンの間隔 */
  z-index:1000;
}

.galleryControlBtn{
  width:150px;
  padding:12px 0;
  font-size:1.1rem;
  text-align:center;
  border:none;
  border-radius:8px;
  background:rgba(255,255,255,0.9);
  color:#000;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
  transition:background 0.2s;
}

.galleryControlBtn:hover{
  background:rgba(255,255,255,1);
}

#galleryImages{
  margin-top:150px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

.galleryItem{
  background:rgba(255,255,255,0.1);
  padding:10px;
  border-radius:8px;
  text-align:center;
}

.galleryItem img{
  max-width:80vw;
  max-height:60vh;
  display:block;
  margin-bottom:10px;
}

.galleryItem button{
  display:block;
  width:130px;
  margin:10px auto;
  padding:10px 0;
  font-size:1rem;
  border:none;
  border-radius:6px;
  background:rgba(255,255,255,0.9);
  color:#000;
  cursor:pointer;
}

.galleryItem button:hover{
  background:rgba(255,255,255,1);
}
</style>
</head>
<body>
<div id="cameraContainer">
  <video id="camera" autoplay playsinline></video>
  <button id="galleryBtn">📷</button>
  <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
  <button id="switchCamBtn">⇆</button>
  <button id="shutterBtn"></button>
</div>

<div id="galleryOverlay">
  <div id="galleryButtons">
    <button id="closeGalleryBtn" class="galleryControlBtn">閉じる</button>
    <button id="shareAllBtn" class="galleryControlBtn">全共有</button>
    <button id="downloadAllBtn" class="galleryControlBtn">全ダウンロード</button>
  </div>
  <div id="galleryImages"></div>
</div>

<script>
const video=document.getElementById('camera');
const shutterBtn=document.getElementById('shutterBtn');
const switchCamBtn=document.getElementById('switchCamBtn');
const galleryBtn=document.getElementById('galleryBtn');
const zoomSlider=document.getElementById('zoomSlider');
const galleryOverlay=document.getElementById('galleryOverlay');
const closeGalleryBtn=document.getElementById('closeGalleryBtn');
const galleryImages=document.getElementById('galleryImages');
const shareAllBtn=document.getElementById('shareAllBtn');
const downloadAllBtn=document.getElementById('downloadAllBtn');

let currentStream=null;
let useFrontCamera=false;
let photos=[];

async function startCamera(){
  if(currentStream){
    currentStream.getTracks().forEach(t=>t.stop());
  }
  try{
    currentStream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:useFrontCamera?'user':'environment'
      },
      audio:false
    });
    video.srcObject=currentStream;
    applyZoom();
  }catch(err){
    console.error('カメラ起動エラー:',err);
  }
}

function applyZoom(){
  const track=currentStream?.getVideoTracks()[0];
  const capabilities=track?.getCapabilities?.();
  if(capabilities?.zoom){
    track.applyConstraints({advanced:[{zoom:parseFloat(zoomSlider.value)}]});
  }
}

// ズームスライダー
zoomSlider.addEventListener('input',applyZoom);

// カメラ切替
switchCamBtn.addEventListener('click',()=>{
  useFrontCamera=!useFrontCamera;
  startCamera();
});

// シャッター
shutterBtn.addEventListener('click',()=>{
  const canvas=document.createElement('canvas');
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  canvas.toBlob(blob=>{
    photos.unshift(blob);  // 新しい写真を上に積む
    updateGalleryThumb(blob);
  },'image/jpeg');

  // 撮影後0.25秒停止
  const track=video.srcObject.getVideoTracks()[0];
  track.enabled=false;
  setTimeout(()=>track.enabled=true,250);
});

// サムネイル更新
function updateGalleryThumb(blob){
  galleryBtn.style.backgroundImage=`url(${URL.createObjectURL(blob)})`;
  galleryBtn.style.backgroundSize='cover';
}

// ギャラリー表示
galleryBtn.addEventListener('click',()=>{
  galleryImages.innerHTML='';
  photos.forEach((blob,i)=>{
    const item=document.createElement('div');
    item.className='galleryItem';
    const img=document.createElement('img');
    img.src=URL.createObjectURL(blob);

    const shareBtn=document.createElement('button');
    shareBtn.textContent='共有';
    shareBtn.addEventListener('click',async()=>{
      const file=new File([blob],`photo_${i}.jpg`,{type:'image/jpeg'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],title:'写真共有'}); }
        catch(err){ console.log('共有エラー',err); }
      }
    });

    const downloadBtn=document.createElement('button');
    downloadBtn.textContent='ダウンロード';
    downloadBtn.addEventListener('click',()=>{
      const a=document.createElement('a');
      a.href=img.src;
      a.download=`photo_${i}.jpg`;
      a.click();
    });

    item.appendChild(img);
    item.appendChild(shareBtn);
    item.appendChild(downloadBtn);

    galleryImages.appendChild(item);
  });
  galleryOverlay.style.display='flex';
});

// 全共有
shareAllBtn.addEventListener('click',async()=>{
  const files=photos.map((b,i)=>new File([b],`photo_${i}.jpg`,{type:'image/jpeg'}));
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files,title:'まとめて共有'}); }
    catch(err){ console.log('全共有エラー',err); }
  }
});

// 全ダウンロード
downloadAllBtn.addEventListener('click',()=>{
  photos.forEach((blob,i)=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`photo_${i}.jpg`;
    a.click();
  });
});

// 閉じる
closeGalleryBtn.addEventListener('click',()=>{
  galleryOverlay.style.display='none';
});

startCamera();
</script>
</body>
</html>
