<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
html, body {
  margin: 0; height: 100%; overflow: hidden; background: black; font-family: sans-serif;
  touch-action: none;
}
video, img#preview {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  object-fit: cover; background: black;
}
img#preview { display: none; z-index: 2; }
.controls { position: absolute; bottom: 40px; left: 0; width: 100%; display: flex; justify-content: center; gap: 40px; z-index: 10; }
#switchCam { position: absolute; bottom: 120px; left: 20px; font-size: 1.4em; color: white; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 8px; border: none; z-index: 10; }
#zoomSlider { position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); width: 200px; z-index: 10; }
#zoomValue { position: absolute; bottom: 230px; left: 50%; transform: translateX(-50%); color: white; z-index: 10; }
#galleryBtn { position: absolute; bottom: 40px; left: 20px; background: rgba(0,0,0,0.3); color: white; padding: 10px 14px; border-radius: 8px; border: none; z-index: 20; pointer-events: auto; }
.shutter { width:80px; height:80px; border:4px solid white; border-radius:50%; background: rgba(255,255,255,0.8); }
.focus-ring { position:absolute; border:2px solid yellow; border-radius:50%; width:80px; height:80px; pointer-events:none; display:none; z-index:12; }
.galleryOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); display:none; flex-direction: column; overflow-y:auto; z-index:1000; padding:20px; align-items:center; }
.galleryHeader { width:100%; display:flex; justify-content:flex-end; gap:10px; margin-bottom:10px; }
.galleryHeader button { padding:8px 12px; border-radius:6px; border:none; background:rgba(255,255,255,0.2); color:white; font-size:1em; cursor:pointer; }
.galleryImages { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; width:100%; }
.galleryItem { position:relative; }
.galleryItem img { max-width:45%; border:2px solid white; border-radius:8px; display:block; }
.shareBtn, .downloadBtn { position:absolute; top:5px; right:5px; background: rgba(0,0,0,0.5); color:white; padding:4px 6px; border-radius:4px; font-size:0.9em; cursor:pointer; }
.downloadBtn { top:30px; }
</style>
</head>
<body>

<video id="camera" autoplay playsinline></video>
<img id="preview" alt="撮影画像">

<button id="switchCam">🔄</button>
<input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1">
<div id="zoomValue">1x</div>
<button id="galleryBtn">🖼️</button>

<div class="controls">
  <button id="captureBtn" class="shutter"></button>
</div>

<div id="focusRing" class="focus-ring"></div>

<div id="galleryOverlay" class="galleryOverlay">
  <div class="galleryHeader">
    <button id="closeGalleryBtn">閉じる</button>
  </div>
  <div class="galleryImages" id="galleryImages"></div>
</div>

<script>
const video = document.getElementById('camera');
const preview = document.getElementById('preview');
const captureBtn = document.getElementById('captureBtn');
const switchCamBtn = document.getElementById('switchCam');
const zoomSlider = document.getElementById('zoomSlider');
const zoomValue = document.getElementById('zoomValue');
const galleryBtn = document.getElementById('galleryBtn');
const galleryOverlay = document.getElementById('galleryOverlay');
const galleryImages = document.getElementById('galleryImages');
const closeGalleryBtn = document.getElementById('closeGalleryBtn');
const focusRing = document.getElementById('focusRing');

let currentFacingMode='environment', stream=null, track=null, photos=[], startPinchDist=null, startZoom=1, isCapturing=false;

// --- カメラ初期化 ---
async function initCamera(facingMode='environment'){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode}});
    video.srcObject = stream;
    track = stream.getVideoTracks()[0];
    setupZoomSlider();
  }catch(err){ alert('カメラを利用できません: '+err.message); }
}

// --- ズーム ---
function setupZoomSlider(){
  const caps = track.getCapabilities();
  if(caps.zoom){
    zoomSlider.min=caps.zoom.min; zoomSlider.max=caps.zoom.max; zoomSlider.step=caps.zoom.step||0.1;
    zoomSlider.value=track.getSettings().zoom||caps.zoom.min;
    zoomSlider.style.display='block'; zoomValue.textContent=zoomSlider.value+'x';
  } else { zoomSlider.style.display='none'; zoomValue.style.display='none'; }
}
zoomSlider.addEventListener('input', async ()=>{
  const z=parseFloat(zoomSlider.value);
  zoomValue.textContent=z.toFixed(1)+'x';
  if(track){ try{ await track.applyConstraints({advanced:[{zoom:z}]}); }catch(e){console.log(e);} }
});

// --- ピンチズーム ---
video.addEventListener('touchstart', e=>{
  if(e.touches.length===2){ e.preventDefault();
    startPinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    startZoom=parseFloat(zoomSlider.value);
  }
});
video.addEventListener('touchmove', e=>{
  if(e.touches.length===2 && startPinchDist && track){ e.preventDefault();
    const newDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    let scale=newDist/startPinchDist;
    let z=Math.min(Math.max(startZoom*scale, zoomSlider.min), zoomSlider.max);
    zoomSlider.value=z.toFixed(2); zoomValue.textContent=z.toFixed(1)+'x';
    try{ track.applyConstraints({advanced:[{zoom:z}]}); }catch(e){console.log(e);}
  }
});
video.addEventListener('touchend', e=>{ if(e.touches.length<2) startPinchDist=null; });

// --- カメラ切替 ---
switchCamBtn.addEventListener('click', ()=>{ currentFacingMode=currentFacingMode==='environment'?'user':'environment'; initCamera(currentFacingMode); });
initCamera(currentFacingMode);

// --- 撮影 ---
captureBtn.addEventListener('click', async ()=>{
  if(isCapturing) return;
  isCapturing=true;

  const canvas=document.createElement('canvas'); canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  const blob = await new Promise(resolve => canvas.toBlob(resolve,'image/jpeg'));
  photos.push(blob);

  const prevUrl = preview.src;
  preview.src = URL.createObjectURL(blob);
  preview.style.display='block';
  video.style.display='none';

  await new Promise(resolve=>setTimeout(resolve,250)); // ← ここを0.25秒に変更

  preview.style.display='none';
  video.style.display='block';

  if(prevUrl) URL.revokeObjectURL(prevUrl);
  isCapturing=false;
});

// --- ギャラリー ---
galleryBtn.addEventListener('click', ()=>{
  galleryImages.innerHTML='';
  photos.forEach((blob,i)=>{
    const item=document.createElement('div'); item.className='galleryItem';
    const img=document.createElement('img'); img.src=URL.createObjectURL(blob); item.appendChild(img);

    const shareBtn=document.createElement('button'); shareBtn.textContent='共有'; shareBtn.className='shareBtn';
    shareBtn.addEventListener('click', async e=>{
      e.stopPropagation(); e.preventDefault();
      const file=new File([blob], `photo_${i}.jpg`, {type:'image/jpeg'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:'写真共有'}); }catch(err){ console.log('共有エラー',err);}
      }
    });

    const downloadBtn=document.createElement('button'); downloadBtn.textContent='ダウンロード'; downloadBtn.className='downloadBtn';
    downloadBtn.addEventListener('click', e=>{
      const a=document.createElement('a'); a.href=img.src; a.download=`photo_${i}.jpg`; a.click();
    });

    item.appendChild(shareBtn); item.appendChild(downloadBtn);
    galleryImages.appendChild(item);
  });
  galleryOverlay.style.display='flex';
});

// --- ギャラリー閉じる ---
closeGalleryBtn.addEventListener('click', ()=>{ galleryOverlay.style.display='none'; });
</script>
</body>
</html>
