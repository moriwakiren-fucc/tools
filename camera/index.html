<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
  }
  video, img {
    width: 90%;
    max-width: 400px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  button {
    display: block;
    width: 200px;
    margin: 15px auto;
    padding: 10px;
    font-size: 1.1em;
  }
</style>
</head>
<body>

<h1>カメラ撮影</h1>

<video id="camera" autoplay playsinline></video>
<br>
<button id="captureBtn">📸 撮影</button>

<img id="preview" alt="撮影した写真が表示されます" style="display:none;">
<br>
<button id="shareBtn" style="display:none;">📤 共有</button>

<script>
const video = document.getElementById('camera');
const preview = document.getElementById('preview');
const captureBtn = document.getElementById('captureBtn');
const shareBtn = document.getElementById('shareBtn');

let capturedBlob = null;

// カメラ起動
async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
  } catch (err) {
    alert('カメラを利用できません: ' + err.message);
  }
}

// 撮影
captureBtn.addEventListener('click', () => {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  canvas.toBlob(blob => {
    capturedBlob = blob;
    preview.src = URL.createObjectURL(blob);
    preview.style.display = 'block';
    shareBtn.style.display = 'inline-block';
  }, 'image/jpeg');
});

// 共有（iOSではシェアシートが出る）
shareBtn.addEventListener('click', async () => {
  if (!capturedBlob) return;

  const file = new File([capturedBlob], 'photo.jpg', { type: 'image/jpeg' });

  if (navigator.share) {
    try {
      await navigator.share({
        files: [file],
        text: '撮影した写真を共有します'
      });
    } catch (err) {
      console.log('共有がキャンセルされました:', err);
    }
  } else {
    // 共有APIが使えない環境ではダウンロードに切り替え
    const a = document.createElement('a');
    a.href = URL.createObjectURL(capturedBlob);
    a.download = 'photo.jpg';
    a.click();
  }
});

initCamera();
</script>

</body>
</html>
