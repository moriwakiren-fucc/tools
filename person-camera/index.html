<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人物検出アラート</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
</head>
<body>
  <h1>人物検出アラート（MoveNet Thunder版）</h1>
  <video id="video" autoplay playsinline style="width:640px; height:auto; border:1px solid #ccc;"></video>
  <canvas id="canvas" width="640" height="480" style="border:1px solid #333;"></canvas>
  <audio id="alertSound" src="alert.mp3" preload="auto"></audio>
  <p id="status">モデルを読み込み中...</p>

  <script>
    let detector, video, ctx;
    const alertSound = document.getElementById('alertSound');

    async function initCamera() {
      video = document.getElementById('video');
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480 }
      });
      video.srcObject = stream;
      await new Promise(resolve => video.onloadedmetadata = resolve);
    }

    async function initModel() {
      // ✅ MoveNet Thunder に切り替え
      detector = await poseDetection.createDetector(
        poseDetection.SupportedModels.MoveNet,
        { modelType: poseDetection.movenet.modelType.THUNDER } // ←ここが重要
      );
      document.getElementById('status').innerText = "モデル準備完了";
    }

    async function detect() {
      const poses = await detector.estimatePoses(video);
      ctx.drawImage(video, 0, 0, 640, 480);

      if (poses.length > 0) {
        // 関節点を描画
        poses[0].keypoints.forEach(kp => {
          if (kp.score > 0.3) {
            ctx.beginPath();
            ctx.arc(kp.x, kp.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = "red";
            ctx.fill();
          }
        });

        // 人物が検出されたら音を鳴らす
        alertSound.play();
      }

      requestAnimationFrame(detect);
    }

    async function main() {
      await initCamera();
      ctx = document.getElementById('canvas').getContext('2d');
      await initModel();
      detect();
    }

    main();
  </script>
</body>
</html>
