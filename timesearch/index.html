<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時刻検索</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    input, button {
      margin: 5px 0;
      padding: 5px;
      font-size: 1rem;
    }
    table {
      border-collapse: collapse;
      margin-top: 20px;
      width: 100%;
      max-width: 600px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 5px 10px;
      text-align: center;
    }
    th {
      background-color: #f0f0f0;
    }
    #resultTable {
      display: none;
    }
  </style>
</head>
<body>
  <h1>列車時刻検索</h1>

  <label>駅名: <input type="text" id="stationInput" placeholder="駅名を入力"></label><br>
  <label>時刻: <input type="text" id="timeInput" placeholder="hh:mm"></label><br>
  <button id="searchBtn">検索</button>

  <table id="resultTable">
    <thead>
      <tr>
        <th>駅名</th>
        <th>時刻</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>

  <script>
    let csvData = [];

    // ページを開いた時にCSV_1_NPHs-NBR_db.csv.csvを読み込む
    window.addEventListener('DOMContentLoaded', () => {
      fetch('CSV_1_NPHs-NBR_db.csv.csv')
        .then(response => {
          if (!response.ok) throw new Error('CSVを読み込めません');
          return response.text();
        })
        .then(text => {
          csvData = text.trim().split('\n').map(line => line.split(','));
          console.log('CSV読み込み完了', csvData);
        })
        .catch(err => {
          alert('CSVの読み込みに失敗しました: ' + err.message);
        });
    });

    // 時刻を分に変換
    function toMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    // 検索ボタン
    document.getElementById('searchBtn').addEventListener('click', () => {
      const station = document.getElementById('stationInput').value.trim();
      const inputTime = document.getElementById('timeInput').value.trim();

      if (!station || !inputTime) {
        alert('駅名と時刻を入力してください');
        return;
      }

      if (!csvData.length) {
        alert('CSVが読み込まれていません');
        return;
      }

      // 駅名 + " 発" の行番号を取得
      const targetRowIndex = csvData.findIndex(row => row[0] === station + ' 発');
      if (targetRowIndex === -1) {
        alert('該当する駅が見つかりません');
        return;
      }

      const timeMinutes = toMinutes(inputTime);
      const row = csvData[targetRowIndex];

      // B列以降から指定時刻以降の最初の2つを探す
      const times = row.slice(1);
      let firstIdx = -1, secondIdx = -1;

      for (let i = 0; i < times.length; i++) {
        const t = times[i].trim();
        if (!t) continue;
        if (/^\d{2}:\d{2}$/.test(t)) {
          if (toMinutes(t) >= timeMinutes) {
            firstIdx = i + 1; // B列はインデックス1なので+1
            break;
          }
        }
      }

      if (firstIdx !== -1) {
        for (let j = firstIdx; j < times.length; j++) {
          const t = times[j].trim();
          if (!t) continue;
          if (/^\d{2}:\d{2}$/.test(t)) {
            secondIdx = j + 1;
            if (secondIdx !== firstIdx) break;
          }
        }
      }

      if (firstIdx === -1 || secondIdx === -1) {
        alert('指定時刻以降の便が見つかりません');
        return;
      }

      // 表示データを作成
      const resultRows = [];

      // 1〜5行目（ヘッダー情報など）
      for (let r = 0; r < 5; r++) {
        resultRows.push([csvData[r][0], csvData[r][firstIdx]]);
      }

      // 該当する駅の行
      resultRows.push([csvData[targetRowIndex][0], csvData[targetRowIndex][firstIdx]]);

      // 表示
      const tableBody = document.getElementById('resultBody');
      tableBody.innerHTML = '';

      resultRows.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${row[0]}</td><td>${row[1]}</td>`;
        tableBody.appendChild(tr);
      });

      document.getElementById('resultTable').style.display = 'table';
    });
  </script>
</body>
</html>
