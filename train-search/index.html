<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>駅時刻検索</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  select, input, button { margin: 5px; padding: 5px; }
  table { border-collapse: collapse; margin-top: 15px; width: 100%; max-width: 500px; }
  th, td { border: 1px solid #333; padding: 6px; text-align: center; }
</style>
</head>
<body>

<h2>駅時刻検索</h2>

<!-- 路線選択 -->
<select id="lineSelect">
  <option value="CSV_db/CSV_1_NPHs-NBR_db.csv">日豊本線 上り</option>
  <option value="CSV_db/CSV_2_NPHs-KDR_db.csv">日豊本線 下り</option>
  <option value="CSV_db/CSV_3_KDHs-NBR_db.csv">久大本線 上り</option>
  <option value="CSV_db/CSV_4_KDHs-KDR_db.csv">久大本線 下り</option>
  <option value="CSV_db/CSV_5_KDHs-NBR_db.csv">豊肥本線 上り</option>
  <option value="CSV_db/CSV_6_KDHs-KDR_db.csv">豊肥本線 下り</option>
</select>

<!-- 駅名と時刻 -->
<input type="text" id="stationInput" placeholder="駅名を入力" value="大分">
<input type="time" id="timeInput">
<button onclick="searchSchedule()">検索</button>

<div id="result"></div>

<script>
let csvData = [];

// ページ読み込み時に初期設定
window.addEventListener('DOMContentLoaded', () => {
  // 現在時刻をtimeInputにセット
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('timeInput').value = `${hh}:${mm}`;

  // 初期路線のCSVを読み込み
  loadCSV(document.getElementById('lineSelect').value);
});

// 路線が変更されたらCSVを再読み込み
document.getElementById('lineSelect').addEventListener('change', (e) => {
  loadCSV(e.target.value);
});

function loadCSV(path) {
  fetch(path)
    .then(res => res.text())
    .then(text => {
      csvData = text.trim().split('\n').map(row => row.split(','));
      console.log('CSV読み込み完了:', path);
    })
    .catch(err => console.error('CSV読み込みエラー:', err));
}

// 時刻を分に変換
function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function searchSchedule() {
  const station = document.getElementById('stationInput').value.trim();
  const inputTime = document.getElementById('timeInput').value;
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = '';

  if (!station || !inputTime) {
    resultDiv.textContent = '駅名と時刻を入力してください';
    return;
  }

  // 駅名 + 発 を含む行を探す
  const rowIndex = csvData.findIndex(row => row[0] === station + ' 発');
  if (rowIndex === -1) {
    resultDiv.textContent = '該当する駅が見つかりません';
    return;
  }

  // 入力時刻より後の最も近い時刻と次の時刻を探す
  const inputMin = timeToMinutes(inputTime);
  let candidate1 = null, candidate2 = null;

  for (let c = 1; c < csvData[rowIndex].length; c++) {
    const t = csvData[rowIndex][c];
    if (t && /^\d{1,2}:\d{2}$/.test(t)) {
      const tMin = timeToMinutes(t);
      if (tMin >= inputMin) {
        if (candidate1 === null) {
          candidate1 = { col: c, time: t };
        } else if (candidate2 === null) {
          candidate2 = { col: c, time: t };
          break;
        }
      }
    }
  }

  if (!candidate1) {
    resultDiv.textContent = '入力した時刻以降の便が見つかりません';
    return;
  }

  // 表を作成
  const table = document.createElement('table');

  // 1,2,3,5行目と該当駅行を両方の候補で表示
  const displayRows = [0,1,2,4,rowIndex]; // 0-based index (1行目,2行目,3行目,5行目,駅行)

  displayRows.forEach(rIdx => {
    const tr = document.createElement('tr');

    // 候補1の列
    const td1 = document.createElement('td');
    td1.textContent = csvData[rIdx][candidate1.col] || '';
    tr.appendChild(td1);

    // 候補2の列
    const td2 = document.createElement('td');
    td2.textContent = candidate2 ? (csvData[rIdx][candidate2.col] || '') : '';
    tr.appendChild(td2);

    table.appendChild(tr);
  });

  resultDiv.appendChild(table);
}
</script>

</body>
</html>
