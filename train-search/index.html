<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>列車時刻検索</title>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
  }
  label {
    margin-right: 5px;
  }
  input, select, button {
    margin: 5px;
    padding: 4px 8px;
    font-size: 14px;
  }
  table {
    border-collapse: separate;
    border-spacing: 20px 8px;
    margin-top: 10px;
  }
  td {
    border: none;
    padding: 4px 8px;
    text-align: center;
  }
  h3 {
    margin-top: 30px;
  }
</style>
</head>
<body>

<h2>列車時刻検索</h2>

<!-- 第1検索（上下線切替用） -->
<div id="search1">
  <h3>第1検索</h3>
  <label for="lineSelect1">路線:</label>
  <select id="lineSelect1">
    <option value="1" selected>日豊本線 上り</option>
    <option value="2">日豊本線 下り</option>
    <option value="3">久大本線 上り</option>
    <option value="4">久大本線 下り</option>
    <option value="5">豊肥本線 上り</option>
    <option value="6">豊肥本線 下り</option>
  </select>

  <label for="stationInput1">駅名:</label>
  <input type="text" id="stationInput1" value="大分">

  <label for="timeInput1">時刻:</label>
  <input type="time" id="timeInput1">

  <button id="searchBtn12">検索（第1＆第2）</button>

  <!-- 第1検索テーブル -->
  <div id="result1"></div>
</div>

<!-- 第2検索（上下線自動切替） -->
<div id="search2">
  <h3>第1検索（上下線切替）</h3>
  <!-- 第2検索テーブル -->
  <div id="result2"></div>
</div>

<!-- 第3検索 -->
<div id="search3">
  <h3>第2検索</h3>

  <label for="lineSelect3">路線:</label>
  <select id="lineSelect3">
    <option value="1" selected>日豊本線 上り</option>
    <option value="2">日豊本線 下り</option>
    <option value="3">久大本線 上り</option>
    <option value="4">久大本線 下り</option>
    <option value="5">豊肥本線 上り</option>
    <option value="6">豊肥本線 下り</option>
  </select>

  <label for="stationInput3">駅名:</label>
  <input type="text" id="stationInput3" value="大分">

  <label for="timeInput3">時刻:</label>
  <input type="time" id="timeInput3">

  <button id="searchBtn3">検索（第3）</button>

  <!-- 第3検索テーブル -->
  <div id="result3"></div>
</div>

<script>
const CANDIDATE_COUNT = 5;

// CSVキャッシュ
const csvCache = {};

// CSVパスを取得
function getCsvPath(num) {
  return `CSV_db/CSV_${num}_NPHs-${(num%2===1?'NBR':'KDR')}_db.csv`;
}

// CSV読み込み
async function loadCSV(num) {
  const path = getCsvPath(num);
  if (csvCache[path]) return csvCache[path];
  const res = await fetch(path);
  const text = await res.text();
  csvCache[path] = text.trim().split('\n').map(row => row.split(','));
  return csvCache[path];
}

// 時刻を分に変換
function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

// 表を作成
function buildTable(csvData, station, inputTime) {
  const targetRowIndex = csvData.findIndex(row => row[0] === station + " 発");
  if (targetRowIndex === -1) return "<p>該当する駅が見つかりません。</p>";

  const row = csvData[targetRowIndex];
  const inputMin = timeToMinutes(inputTime);

  let allTimes = [];
  for (let c = 1; c < row.length; c++) {
    const t = row[c];
    if (t && /^\d{1,2}:\d{2}$/.test(t)) {
      const tm = timeToMinutes(t);
      if (tm >= inputMin) {
        allTimes.push({col: c, time: t, minutes: tm});
      }
    }
  }
  allTimes.sort((a,b) => a.minutes - b.minutes);
  const nextTimes = allTimes.slice(0, CANDIDATE_COUNT);
  if (nextTimes.length === 0) return "<p>該当する候補が見つかりません。</p>";

  let html = "<table>";
  nextTimes.forEach(candidate => {
    html += "<tr>";
    [1,2,3,5].forEach(r => {
      html += `<td>${csvData[r-1][candidate.col] || ''}</td>`;
    });
    html += `<td>${csvData[targetRowIndex][candidate.col] || ''}</td>`;
    html += "</tr>";
  });
  html += "</table>";
  return html;
}

// 検索処理（第1＆第2）
async function search12() {
  const line1 = parseInt(document.getElementById('lineSelect1').value);
  const station1 = document.getElementById('stationInput1').value.trim();
  const time1 = document.getElementById('timeInput1').value;

  if (!station1 || !time1) return;

  localStorage.setItem('line1', line1);
  localStorage.setItem('station1', station1);

  const oppLine = (line1 % 2 === 1) ? line1 + 1 : line1 - 1;

  const csv1 = await loadCSV(line1);
  const csv2 = await loadCSV(oppLine);

  document.getElementById('result1').innerHTML = buildTable(csv1, station1, time1);
  document.getElementById('result2').innerHTML = buildTable(csv2, station1, time1);
}

// 検索処理（第3）
async function search3() {
  const line3 = parseInt(document.getElementById('lineSelect3').value);
  const station3 = document.getElementById('stationInput3').value.trim();
  const time3 = document.getElementById('timeInput3').value;

  if (!station3 || !time3) return;

  localStorage.setItem('line3', line3);
  localStorage.setItem('station3', station3);

  const csv3 = await loadCSV(line3);
  document.getElementById('result3').innerHTML = buildTable(csv3, station3, time3);
}

// イベント
document.getElementById('searchBtn12').addEventListener('click', search12);
document.getElementById('searchBtn3').addEventListener('click', search3);

// 初期値
window.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  const defaultTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  document.getElementById('lineSelect1').value = localStorage.getItem('line1') || 1;
  document.getElementById('stationInput1').value = localStorage.getItem('station1') || '大分';
  document.getElementById('timeInput1').value = defaultTime;

  document.getElementById('lineSelect3').value = localStorage.getItem('line3') || 1;
  document.getElementById('stationInput3').value = localStorage.getItem('station3') || '大分';
  document.getElementById('timeInput3').value = defaultTime;
});
</script>

</body>
</html>
