<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>列車時刻検索</title>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
  }
  label {
    margin-right: 5px;
  }
  input, select, button {
    margin: 5px;
    padding: 4px 8px;
    font-size: 14px;
  }
  table {
    border-collapse: separate;       /* セル間の隙間を作る */
    border-spacing: 20px 8px;        /* 横方向20px、縦方向8px */
    margin-top: 20px;
  }
  td {
    border: none;                    /* 枠線なし */
    padding: 4px 8px;
    text-align: center;
  }
  tr.header-row td {
    font-weight: bold;
  }
</style>
</head>
<body>

<h2>列車時刻検索</h2>

<label for="lineSelect">路線:</label>
<select id="lineSelect">
  <option value="CSV_db/CSV_1_NPHs-NBR_db.csv">日豊本線 上り</option>
  <option value="CSV_db/CSV_2_NPHs-KDR_db.csv">日豊本線 下り</option>
  <option value="CSV_db/CSV_3_NPHs-NBR_db.csv">久大本線 上り</option>
  <option value="CSV_db/CSV_4_NPHs-KDR_db.csv" selected>久大本線 下り</option>
  <option value="CSV_db/CSV_5_NPHs-NBR_db.csv">豊肥本線 上り</option>
  <option value="CSV_db/CSV_6_NPHs-KDR_db.csv">豊肥本線 下り</option>
</select>

<label for="stationInput">駅名:</label>
<input type="text" id="stationInput" value="古国府">

<label for="timeInput">時刻:</label>
<input type="time" id="timeInput">

<button id="searchBtn">検索</button>

<div id="result"></div>

<script>
let csvData = [];

// ページ読み込み時に現在時刻を初期値に設定
window.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('timeInput').value = `${hh}:${mm}`;

  loadCSV(document.getElementById('lineSelect').value);
});

// 路線選択時にCSVを再ロード
document.getElementById('lineSelect').addEventListener('change', (e) => {
  loadCSV(e.target.value);
});

// CSVを取得
async function loadCSV(path) {
  try {
    const res = await fetch(path);
    const text = await res.text();
    csvData = text.trim().split('\n').map(row => row.split(','));
  } catch (err) {
    console.error('CSV読み込みエラー:', err);
    csvData = [];
  }
}

// 時刻を分に変換
function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

// 検索処理
document.getElementById('searchBtn').addEventListener('click', () => {
  const station = document.getElementById('stationInput').value.trim();
  const inputTime = document.getElementById('timeInput').value;

  if (!station || !inputTime || csvData.length === 0) {
    document.getElementById('result').innerHTML = "<p>データが不足しています。</p>";
    return;
  }

  const targetRowIndex = csvData.findIndex(row => row[0] === station + " 発");
  if (targetRowIndex === -1) {
    document.getElementById('result').innerHTML = "<p>該当する駅が見つかりません。</p>";
    return;
  }

  const row = csvData[targetRowIndex];
  const inputMin = timeToMinutes(inputTime);

  // 指定時刻以降の最初の時刻と次の時刻を探す
  let nextTimes = [];
  for (let c = 1; c < row.length; c++) {
    const t = row[c];
    if (t && /^\d{1,2}:\d{2}$/.test(t)) {
      const tm = timeToMinutes(t);
      if (tm >= inputMin) {
        nextTimes.push({col: c, time: t});
        if (nextTimes.length === 2) break;
      }
    }
  }

  if (nextTimes.length < 2) {
    document.getElementById('result').innerHTML = "<p>該当する候補が見つかりません。</p>";
    return;
  }

  // 表示用データを構築（行列入れ替え）
  const c1 = nextTimes[0].col;
  const c2 = nextTimes[1].col;

  let html = "<table>";

  // 候補1の行
  html += "<tr>";
  [1,2,3,5].forEach(r => {
    html += `<td>${csvData[r-1][c1] || ''}</td>`;
  });
  html += `<td>${csvData[targetRowIndex][c1] || ''}</td>`;
  html += "</tr>";

  // 候補2の行
  html += "<tr>";
  [1,2,3,5].forEach(r => {
    html += `<td>${csvData[r-1][c2] || ''}</td>`;
  });
  html += `<td>${csvData[targetRowIndex][c2] || ''}</td>`;
  html += "</tr>";

  html += "</table>";

  document.getElementById('result').innerHTML = html;
});
</script>

</body>
</html>
