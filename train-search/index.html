<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>列車時刻検索</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  label { margin-right: 5px; }
  input, select, button { margin: 5px; padding: 4px 8px; font-size: 14px; }
  table { border-collapse: separate; border-spacing: 20px 8px; margin-top: 10px; }
  td { padding: 4px 8px; text-align: center; }
  h3 { margin-top: 30px; }
  .search-block { margin-bottom: 30px; }

  /* 横並び用のレイアウト */
  .results {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;               /* 上りと下りの間隔 */
    margin-top: 10px;
  }
  .result-block {
    flex: 1 1 300px;         /* 幅が確保できれば横並び */
    min-width: 300px;        /* 狭いときは自動で縦並び */
  }
  @media (max-width: 1080px) {
    .results {
      flex-direction: column; /* 狭い画面では縦並び */
    }
  }
</style>
</head>
<body>

<h2>列車時刻検索</h2>

<!-- 第1検索 -->
<div class="search-block">
  <h3>第1検索</h3>
  <label>路線:</label>
  <select id="lineSelect1">
    <option value="NPH">日豊本線</option>
    <option value="KDH">久大本線</option>
    <option value="HHH">豊肥本線</option>
  </select>

  <label>駅名:</label>
  <input type="text" id="stationInput1" value="大分">

  <label>時刻:</label>
  <input type="time" id="timeInput1">

  <button id="searchBtn1">検索</button>

  <div class="results">
    <div class="result-block">
      <h4>上り</h4>
      <div id="result1_up"></div>
    </div>
    <div class="result-block">
      <h4>下り</h4>
      <div id="result1_down"></div>
    </div>
  </div>
</div>

<!-- 第2検索 -->
<div class="search-block">
  <h3>第2検索</h3>
  <label>路線:</label>
  <select id="lineSelect2">
    <option value="NPH">日豊本線</option>
    <option value="KDH">久大本線</option>
    <option value="HHH">豊肥本線</option>
  </select>

  <label>駅名:</label>
  <input type="text" id="stationInput2" value="大分">

  <label>時刻:</label>
  <input type="time" id="timeInput2">

  <button id="searchBtn2">検索</button>

  <div class="results">
    <div class="result-block">
      <h4>上り</h4>
      <div id="result2_up"></div>
    </div>
    <div class="result-block">
      <h4>下り</h4>
      <div id="result2_down"></div>
    </div>
  </div>
</div>

<script>
const CANDIDATE_COUNT = 5;

// ✅ 路線ごとのCSVパス
const csv_paths = {
  NPH: { up: "CSV_db/CSV_1_NPHs-NBR_db.csv", down: "CSV_db/CSV_2_NPHs-KDR_db.csv" },
  KDH: { up: "CSV_db/CSV_3_KDHs-NBR_db.csv", down: "CSV_db/CSV_4_KDHs-KDR_db.csv" },
  HHH: { up: "CSV_db/CSV_5_HHHs-NBR_db.csv", down: "CSV_db/CSV_6_HHHs-KDR_db.csv" }
};

// CSVキャッシュ
const csvCache = {};

// CSV読み込み
async function loadCSV(path) {
  if (!path) return [];
  if (csvCache[path]) return csvCache[path];

  const res = await fetch(path);
  const text = await res.text();
  csvCache[path] = text.trim().split('\n').map(row => row.split(','));
  return csvCache[path];
}

// 時刻を分に変換
function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

// 表を作成
function buildTable(csvData, station, inputTime) {
  const targetRowIndex = csvData.findIndex(row => row[0] === station + " 発");
  if (targetRowIndex === -1) return "<p>該当する駅が見つかりません。</p>";

  const row = csvData[targetRowIndex];
  const inputMin = timeToMinutes(inputTime);

  // 入力時刻以降を取得して時刻順に並べる
  let allTimes = [];
  for (let c = 1; c < row.length; c++) {
    const t = row[c];
    if (t && /^\d{1,2}:\d{2}$/.test(t)) {
      const tm = timeToMinutes(t);
      if (tm >= inputMin) {
        allTimes.push({col: c, time: t, minutes: tm});
      }
    }
  }
  allTimes.sort((a,b) => a.minutes - b.minutes);

  const nextTimes = allTimes.slice(0, CANDIDATE_COUNT);
  if (nextTimes.length === 0) return "<p>該当する候補が見つかりません。</p>";

  // 表構築
  let html = "<table>";
  nextTimes.forEach(candidate => {
    html += "<tr>";
    [1,2,3,5].forEach(r => {
      html += `<td>${csvData[r-1][candidate.col] || ''}</td>`;
    });
    html += `<td>${csvData[targetRowIndex][candidate.col] || ''}</td>`;
    html += "</tr>";
  });
  html += "</table>";
  return html;
}

// ✅ 検索関数（上下線両方）
async function search(lineKey, station, time, upResultId, downResultId) {
  if (!station || !time) return;

  const upCSV = await loadCSV(csv_paths[lineKey].up);
  const downCSV = await loadCSV(csv_paths[lineKey].down);

  document.getElementById(upResultId).innerHTML = buildTable(upCSV, station, time);
  document.getElementById(downResultId).innerHTML = buildTable(downCSV, station, time);
}

// イベント登録
document.getElementById('searchBtn1').addEventListener('click', () => {
  const line = document.getElementById('lineSelect1').value;
  const station = document.getElementById('stationInput1').value.trim();
  const time = document.getElementById('timeInput1').value;
  search(line, station, time, 'result1_up', 'result1_down');
});

document.getElementById('searchBtn2').addEventListener('click', () => {
  const line = document.getElementById('lineSelect2').value;
  const station = document.getElementById('stationInput2').value.trim();
  const time = document.getElementById('timeInput2').value;
  search(line, station, time, 'result2_up', 'result2_down');
});

// 初期化
window.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  const defaultTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  document.getElementById('timeInput1').value = defaultTime;
  document.getElementById('timeInput2').value = defaultTime;
});
</script>

</body>
</html>
