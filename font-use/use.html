<!DOCTYPE html>
<html lang="ja">
  <head>
    <style>
      @font-face {
        font-family: "fontA"; /*任意のフォントファミリー名でOK*/
        src: url("./fonts/HOT-GFKaishokk-E.otf") format("opentype"); /*fontがあるパスを書いて、formatを指定*/
        font-display: swap;
      }
      @font-face {
        font-family: "fontB"; /*任意のフォントファミリー名でOK*/
        src: url("./fonts/ackaisyo.ttf") format("truetype"); /*fontがあるパスを書いて、formatを指定*/
        font-display: swap;
      }
      p {
        writing-mode: vertical-rl;
        font-size: 50px;
      }
      .A {
        font-family: "fontA",sans-serif;
      }
      .B {
        font-family: "fontB",sans-serif;
      }
    </style>
  </head>
  <body>
    <p class="B">右の者は本化学部の全課程を<br>修了したことを証する！</p>
  </body>
</html>
