<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>画像お絵かきサイト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="file" id="imageInput">

<div id="canvasWrapper">
  <img id="baseImage">
  <canvas id="drawCanvas"></canvas>
</div>

<div class="controls">
  <button id="penBtn">ペン</button>
  <input type="color" id="colorPicker">

  <label>
    ペン太さ
    <input type="range" id="penSize" min="1" max="30">
    <canvas id="penPreview" width="40" height="40"></canvas>
  </label>

  <button id="eraserBtn">消しゴム</button>

  <label>
    消しゴム太さ
    <input type="range" id="eraserSize" min="5" max="60">
    <canvas id="eraserPreview" width="40" height="40"></canvas>
  </label>

  <button id="undoBtn">取り消す</button>
  <button id="redoBtn">やり直し</button>

  <label>
    <input type="checkbox" id="toggleCanvas" checked>
    ペン跡を表示
  </label>
</div>

<script src="main.js"></script>
</body>
</html>
