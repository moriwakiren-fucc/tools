<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>画像一覧と共有</title>
<style>
body {
    font-family: sans-serif;
    padding: 20px;
}
#file-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
}
.file-item {
    border: 1px solid #bbb;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
}
.file-item img {
    width: 100%;
    border-radius: 6px;
}
.controls {
    margin-bottom: 20px;
}
button {
    padding: 8px 14px;
    margin-right: 10px;
}
</style>
</head>
<body>

<h2>画像一覧</h2>

<div class="controls">
    <button id="share-all">すべて共有</button>
    <button id="share-selected">選択したものを共有</button>
</div>

<div id="file-list"></div>

<script>
// JSON 読み込み
fetch("./files.json")
    .then(res => res.json())
    .then(list => renderImages(list));

// 一覧生成
function renderImages(list) {
    const container = document.getElementById("file-list");
    container.innerHTML = "";

    list.forEach(name => {
        const filePath = "media/" + name; // 任意：画像フォルダ名
        const div = document.createElement("div");
        div.className = "file-item";

        div.innerHTML = `
            <img src="${filePath}" alt="${name}">
            <p>${name}</p>
            <label>
                <input type="checkbox" class="select-box" data-path="${filePath}">
                選択する
            </label>
        `;

        container.appendChild(div);
    });
}

// 全共有
document.getElementById("share-all").addEventListener("click", () => {
    fetch("./files.json")
        .then(res => res.json())
        .then(list => {
            const urls = list.map(name => location.origin + "/media/" + name);
            shareUrls(urls);
        });
});

// 選択共有
document.getElementById("share-selected").addEventListener("click", () => {
    const selected = [...document.querySelectorAll(".select-box:checked")]
        .map(ch => location.origin + "/" + ch.dataset.path);

    if (selected.length === 0) {
        alert("何も選択されていません");
        return;
    }

    shareUrls(selected);
});

// Web Share API
function shareUrls(urls) {
    if (navigator.share) {
        navigator.share({
            title: "画像共有",
            text: "以下の画像をご確認ください。",
            url: urls.join("\n")
        });
    } else {
        alert("このブラウザは共有に対応していません:\n" + urls.join("\n"));
    }
}
</script>

</body>
</html>
