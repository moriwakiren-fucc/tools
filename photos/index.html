<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>画像一括共有</title>
</head>
<body>

<script>
// JSON 読み込み
fetch("./files.json")
  .then(res => res.json())
  .then(async list => {
    try {
      // JSON の画像名を File オブジェクト化
      const files = await Promise.all(
        list.map(async name => {
          const blob = await fetch("media/" + name).then(r => r.blob());
          return new File([blob], name, { type: blob.type });
        })
      );

      // Web Share API で共有
      if (navigator.canShare && navigator.canShare({ files })) {
        await navigator.share({
          title: "画像共有",
          text: "画像をまとめて共有します",
          files: files
        });
      } else {
        alert("このブラウザは画像ファイルの共有に対応していません");
      }
    } catch (err) {
      console.error("共有に失敗:", err);
      alert("共有に失敗しました");
    }
  });
</script>

</body>
</html>
